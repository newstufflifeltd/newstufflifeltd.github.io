name: Update eBay Storefront

on:
  schedule:
    # Runs every 6 hours (at 00:00, 06:00, 12:00, and 18:00 UTC)
    - cron: '0 */6 * * *'
  # Allows you to trigger the script manually from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write # Required so the bot can commit the new items.json

jobs:
  update-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser beautifulsoup4 requests

      - name: Run eBay scraper
        run: python fetch_listings.py

      - name: Commit and push updated items.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add items.json
          # Only commit if items.json actually changed
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update eBay listings" && git push)
